<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HyperNova Messenger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #050b1e, #081a3a);
      color: white;
    }

    header {
      background: #0a2a66;
      padding: 16px 20px;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #1fbfff;
    }

    .badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00a67e, #00c88f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
    }

    #chat {
      padding: 20px;
      height: calc(100vh - 150px);
      overflow-y: auto;
    }

    .msg {
      margin-bottom: 12px;
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.4;
    }

    .user {
      background: #1f6fff;
      align-self: flex-end;
      margin-left: auto;
    }

    .bot {
      background: #0e3a4f;
      border: 1px solid #1fbfff;
    }

    footer {
      display: flex;
      padding: 12px;
      background: #061a33;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      background: #1fbfff;
      color: black;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #3ad1ff;
    }
  </style>
</head>

<body>

<header>
  <div class="badge">⚡</div>
  AzureGPT (Powered by ChatGPT)
</header>

<div id="chat"></div>

<footer>
  <input id="messageInput" placeholder="Type a message..." />
  <button onclick="sendMessage()">Send</button>
</footer>

<script>
  const WORKER_URL = "https://azure-gptworker.omerkuzeyseyhan5.workers.dev";

  function appendMessage(chat,role,text) {
    const message = document.createElement("div");
    message.className = role === "user" ? "msg user" : "msg bot";
    const label = document.createElement("b");
    label.textContent = role === "user" ? "You:" : "AzureGPT:";
    message.appendChild(label);
    message.appendChild(document.createTextNode(" " + String(text)));
    chat.appendChild(message);
  }

  async function sendMessage() {
    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");
    const text = input.value.trim();

    if (!text) return;

    appendMessage(chat,"user",text);
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    appendMessage(chat,"bot",data.reply);
    chat.scrollTop = chat.scrollHeight;
  }
</script>

</body>
</html>
