<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HyperNova</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
:root{
  --neon:#1fbfff;
  --bg:#030814;
  --panel:#071a33;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: radial-gradient(circle at top, #0b1d3a, var(--bg));
  color:white;
  overflow-x:hidden;
}

/* NAV */
nav{
  position:sticky;
  top:0;
  z-index:999;
  background:linear-gradient(90deg,#061b38,#0b2f5f);
  display:flex;
  align-items:center;
  padding:14px 30px;
  border-bottom:2px solid var(--neon);
}
.logo{
  font-size:22px;
  font-weight:800;
  color:var(--neon);
}
.nav-links{
  display:flex;
  gap:22px;
  margin-left:auto;
}
.nav-links a{
  color:white;
  text-decoration:none;
  font-weight:600;
  position:relative;
}
.nav-links a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-4px;
  width:0%;
  height:2px;
  background:var(--neon);
  transition:.3s;
}
.nav-links a:hover::after{width:100%}

.whoosh{
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(31,191,255,.2),transparent);
  animation:whoosh 4s linear infinite;
  pointer-events:none;
}
@keyframes whoosh{
  from{transform:translateX(-100%)}
  to{transform:translateX(100%)}
}

/* SECTIONS */
section{padding:60px 10%}
h1{color:var(--neon)}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.card{
  background:var(--panel);
  border:1px solid rgba(31,191,255,.25);
  border-radius:16px;
  padding:20px;
  transition:.3s;
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 0 25px rgba(31,191,255,.35);
}

/* CHAT */
.chat{
  max-width:700px;
  margin:auto;
  background:#041427;
  border-radius:16px;
  border:1px solid var(--neon);
  display:flex;
  flex-direction:column;
  height:420px;
}
.chat-log{
  flex:1;
  padding:16px;
  overflow-y:auto;
}
.msg{
  margin-bottom:10px;
  padding:10px 14px;
  border-radius:14px;
  max-width:80%;
}
.user{background:#1f6fff;margin-left:auto}
.ai{background:#083a55;border:1px solid var(--neon)}

.chat-input{
  display:flex;
  gap:10px;
  padding:12px;
}
.chat-input input{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:none;
}
.chat-input button{
  padding:12px 18px;
  border:none;
  border-radius:12px;
  background:var(--neon);
  font-weight:bold;
  cursor:pointer;
}

footer{text-align:center;padding:30px;opacity:.7}
</style>
</head>

<body>

<nav>
  <div class="logo">⚡ HyperNova</div>
  <div class="nav-links">
    <a href="#home">Home</a>
    <a href="#comics">Comics</a>
    <a href="#films">Films</a>
    <a href="#store">Store</a>
    <a href="#messenger">Messenger</a>
    <a href="#about">About</a>
  </div>
  <div class="whoosh"></div>
</nav>

<section id="home">
  <h1>Welcome to HyperNova</h1>
  <p>A comic & film universe powered by AI.</p>
</section>

<section id="comics">
  <h1>Comics</h1>
  <div class="grid">
    <div class="card">Issue #1 – Preview</div>
    <div class="card">Issue #2 – Coming Soon</div>
  </div>
</section>

<section id="films">
  <h1>Films</h1>
  <div class="grid">
    <div class="card">HyperNova Origins</div>
    <div class="card">Animated Shorts</div>
  </div>
</section>

<section id="store">
  <h1>Store</h1>
  <div class="grid">
    <div class="card">Comic – 10 QAR</div>
    <div class="card">Comic – 50 HP</div>
  </div>
</section>

<section id="messenger">
  <h1>Messenger</h1>
  <div class="chat">
    <div class="chat-log" id="log">
      <div class="msg ai">AzureGPT is online ⚡</div>
    </div>
    <div class="chat-input">
      <input id="msg" placeholder="Type message...">
      <button onclick="send()">Send</button>
    </div>
  </div>
</section>

<section id="about"></section>

<footer>© HyperNova Universe</footer>

<script>
const WORKER_URL = "https://azure-gptworker.omerkuzeyseyhan5.workers.dev";

async function send(){
  const input = document.getElementById("msg");
  const log = document.getElementById("log");
  const text = input.value.trim();
  if(!text) return;

  log.innerHTML += `<div class="msg user">${text}</div>`;
  input.value = "";
  log.scrollTop = log.scrollHeight;

  try{
    const res = await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text})
    });

    const data = await res.json();
    log.innerHTML += `<div class="msg ai">${data.reply}</div>`;
    log.scrollTop = log.scrollHeight;
  }catch(e){
    log.innerHTML += `<div class="msg ai">⚠️ AzureGPT error</div>`;
  }
}
</script>

</body>
</html>
