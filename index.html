<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HyperNova</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#030814;
  color:white;
}
.hidden{display:none}
.center{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.card{
  background:#071a33;
  padding:30px;
  border-radius:16px;
  width:300px;
  box-shadow:0 0 25px rgba(31,191,255,0.3);
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}
button{
  background:#1fbfff;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#45d3ff}

.chat{
  max-width:700px;
  margin:30px auto;
  border:1px solid #1fbfff;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  height:420px;
}
.chat-log{
  flex:1;
  padding:16px;
  overflow-y:auto;
}
.msg{
  margin-bottom:10px;
  padding:10px 14px;
  border-radius:14px;
  max-width:80%;
}
.user{background:#1f6fff;margin-left:auto}
.ai{background:#083a55;border:1px solid #1fbfff}
.typing{opacity:0.6;font-style:italic}

.chat-input{
  display:flex;
  padding:10px;
  gap:10px;
}
.chat-input input{flex:1}

h2{text-align:center;color:#1fbfff}
p.link{text-align:center;cursor:pointer;color:#1fbfff}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="center">
  <div class="card">
    <h2>Login</h2>
    <input id="loginUser" placeholder="Username">
    <button onclick="login()">Login</button>
    <p class="link" onclick="showSignup()">Create account</p>
  </div>
</div>

<!-- SIGNUP -->
<div id="signup" class="center hidden">
  <div class="card">
    <h2>Sign Up</h2>
    <input id="signupUser" placeholder="Username">
    <button onclick="signup()">Sign Up</button>
    <p class="link" onclick="showLogin()">Back to login</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <h2>AzureGPT ⚡</h2>
  <div class="chat">
    <div class="chat-log" id="log"></div>
    <div class="chat-input">
      <input id="msg" placeholder="Type message..." onkeydown="handleKey(event)">
      <button onclick="send()">Send</button>
    </div>
  </div>
</div>

<script>
const WORKER_URL = "https://azure-gptworker.omerkuzeyseyhan5.workers.dev";
let currentUser = null;

/* ---------- NAV ---------- */
function showSignup(){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("signup").classList.remove("hidden");
}
function showLogin(){
  document.getElementById("signup").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
}

/* ---------- AUTH ---------- */
function signup(){
  const u = document.getElementById("signupUser").value.trim();
  if(!u) return alert("Enter a username");

  if(localStorage.getItem("user_"+u)){
    alert("User already exists");
    return;
  }

  localStorage.setItem("user_"+u, JSON.stringify([]));
  document.getElementById("loginUser").value = u;
  showLogin();
}

function login(){
  const u = document.getElementById("loginUser").value.trim();
  if(!localStorage.getItem("user_"+u)){
    alert("User not found");
    return;
  }

  currentUser = u;
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  loadChat();
}

/* ---------- SAFE MESSAGE RENDERING ---------- */
function appendMessage(log,role,text){
  const message = document.createElement("div");
  message.className = role === "user" ? "msg user" : "msg ai";
  message.textContent = String(text);
  log.appendChild(message);
}

/* ---------- CHAT MEMORY ---------- */
function loadChat(){
  const log = document.getElementById("log");
  log.replaceChildren();
  const history = JSON.parse(localStorage.getItem("user_"+currentUser));
  history.forEach(m=>{
    appendMessage(log,m.role,m.text);
  });
  log.scrollTop = log.scrollHeight;
}

function save(role,text){
  const h = JSON.parse(localStorage.getItem("user_"+currentUser));
  h.push({role,text});
  localStorage.setItem("user_"+currentUser, JSON.stringify(h));
}

/* ---------- CHAT ---------- */
function handleKey(e){
  if(e.key==="Enter") send();
}

async function send(){
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if(!text) return;

  input.value = "";
  const log = document.getElementById("log");

  appendMessage(log,"user",text);
  save("user",text);

  const typing = document.createElement("div");
  typing.className="msg ai typing";
  typing.innerText="AzureGPT is thinking…";
  log.appendChild(typing);
  log.scrollTop = log.scrollHeight;

  try{
    const res = await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text})
    });

    const data = await res.json();
    typing.remove();

    appendMessage(log,"ai",data.reply);
    save("ai",data.reply);
    log.scrollTop = log.scrollHeight;

  }catch{
    typing.remove();
    appendMessage(log,"ai","⚠️ Connection error");
  }
}
</script>

</body>
</html>
